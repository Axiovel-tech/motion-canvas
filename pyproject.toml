[project]
name = "motion-canvas"
version = "4.3.0"
description = "Motion Canvas is Axiovel's professional drone show designer framework integrated into Blender"
license = "GPL-3.0-or-later"
authors = [{ name = "Axiovel" }]
maintainers = [{ name = "Axiovel" }]
package-mode = false
requires-python = ">=3.11"
dependencies = ["natsort>=8.0.0"]

[project.urls]
Homepage = "https://axiovel.com"
Repository = "https://github.com/Axiovel-tech/motion-canvas"
Documentation = "https://github.com/Axiovel-tech/motion-canvas/tree/main/doc"

[dependency-groups]
dev = [
    "numpy",
    "pyclean>=2.0.0",
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-root = "src/modules"
module-name = "sbstudio"

[tool.ruff]
lint.ignore = ["B027", "B905", "C901", "E402", "E501", "E731"]
lint.select = ["B", "C", "E", "F", "I", "W"]
extend-exclude = [
  "src/modules/sbstudio/vendor",
  "src/modules/sbstudio/i18n/translations.py",
]

[tool.ty.environment]
extra-paths = ["./typings"]

[tool.ty.src]
exclude = [
  "vendor",
  "src/modules/sbstudio/vendor",
  "src/addons/io_import_skybrush_*.py",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src/modules"]
testpaths = ["tests"]
# tests/blender runs inside Blender, see the script's docstring
norecursedirs = ["blender"]
